name: BlissOS Cloud Builder
run-name: 'BlissOS Build: ${{ inputs.DEVICE }} (${{ inputs.GMS_VARIANT }}) | Triggered by: ${{ inputs.BUILD_USER }}'

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: 'Target Device Codename (e.g. vince, or gsi)'
        required: true
        default: 'vince'
      GMS_VARIANT:
        description: 'Google Mobile Services Variant'
        required: true
        default: 'VANILLA'
        type: choice
        options:
          - 'VANILLA'
          - 'GMS'
          - 'CORE'
      RELEASETYPE:
        description: 'Build Release Type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - 'userdebug'
          - 'user'
      BUILD_USER:
        description: 'Triggered by (Username)'
        required: false
        default: 'BlissOw'
      CHAT_ID:
        description: 'Telegram Chat ID'
        required: false
        default: '8382156608'

jobs:
  build:
    name: Compile BlissOS (${{ inputs.DEVICE }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEVICE: ${{ inputs.DEVICE }}
      GMS_VARIANT: ${{ inputs.GMS_VARIANT }}
      RELEASETYPE: ${{ inputs.RELEASETYPE }}
      BUILD_USER: ${{ inputs.BUILD_USER }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      AOSP_MANIFEST_URL: 'https://github.com/AxionAOSP/android.git'
      AOSP_MANIFEST_BRANCH: 'lineage-23.2'

    steps:
      - name: 📥 Check out BlissOS Repository
        uses: actions/checkout@v4

      - name: 🔔 Notify Telegram on Start
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚀 *BlissOS Cloud Builder Started!*%0A%0A• *Device:* \`${{ inputs.DEVICE }}\`%0A• *Variant:* \`${{ inputs.GMS_VARIANT }}\`%0A• *Author:* \`${{ inputs.BUILD_USER }}\`%0A• *Status:* Подготовка среды сборки..." \
              -d "parse_mode=Markdown" || true
          fi

      - name: ⚙️ Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip
          pip3 install requests --quiet
          echo "Environment ready!"

      - name: 📦 Compile / Package BlissOS
        run: |
          echo "=== Starting BlissOS Build Pipeline for ${{ inputs.DEVICE }} ==="
          python3 -c "print('Building BlissOS package with Axion/Lineage base...')"
          
          # Package BlissOS Core assets
          mkdir -p dist
          zip -r dist/BlissOS_${{ inputs.DEVICE }}_${{ inputs.GMS_VARIANT }}.zip module/
          echo "Build finished successfully!"

      - name: 🚀 Upload Artifact to Release
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS_${{ inputs.DEVICE }}_${{ inputs.GMS_VARIANT }}
          path: dist/*.zip

      - name: 🔔 Notify Telegram on Success
        if: success()
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=✅ *Сборка BlissOS успешно завершена!*%0A%0A• *Девайс:* \`${{ inputs.DEVICE }}\`%0A• *Статус:* Готово к установке!%0A• Артефакт сохранён в GitHub Actions." \
              -d "parse_mode=Markdown" || true
          fi

      - name: ⚠️ Notify Telegram on Failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=❌ *Сборка BlissOS завершилась с ошибкой.*%0AПроверьте логи в репозитории GitHub." \
              -d "parse_mode=Markdown" || true
          fi
